[project]
name = "home-automation"
version = "1.0.0"
description = "IoT Home Automation System with ESP32, Home Assistant and HAVEN UI"
readme = "README.md"
requires-python = ">=3.9"

[tool.vercel]
entrypoint = "app.py"

[tool.pyright]
extraPaths = ["python_backend"]

[tool.pylance]
extraPaths = ["python_backend"]
